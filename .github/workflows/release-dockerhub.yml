name: Release to Docker Hub

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-dockerhub-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Build and smoke test release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: svnpanel:release-ci
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            BUILD_TIME=${{ github.event.release.published_at }}
          cache-from: type=gha,scope=svnpanel-image
          cache-to: type=gha,mode=max,scope=svnpanel-image

      - name: Start container
        run: |
          docker run --detach \
            --name svnpanel-release-ci \
            --publish 18080:8080 \
            --publish 13690:3690 \
            --env SVNPANEL_ADMIN_USERNAME=admin \
            --env SVNPANEL_ADMIN_PASSWORD=ci-admin-password \
            --env SVN_INIT_REPO=smoke \
            svnpanel:release-ci

      - name: Verify services
        run: |
          set -euo pipefail
          cleanup() {
            docker logs svnpanel-release-ci || true
            docker rm --force svnpanel-release-ci || true
          }
          trap cleanup EXIT

          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:18080/api/v1/healthz

          for attempt in $(seq 1 20); do
            set +e
            docker exec svnpanel-release-ci \
              svn info --non-interactive svn://127.0.0.1/smoke \
              > /tmp/svnserve-release-smoke.log 2>&1
            svn_status=$?
            set -e
            if [ "$svn_status" -eq 0 ]; then
              exit 0
            fi
            if grep -Eq \
              'E170001|authorization failed|Authorization failed' \
              /tmp/svnserve-release-smoke.log; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/svnserve-release-smoke.log
          exit 1

  publish:
    name: Publish release to Docker Hub
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Missing repository secret DOCKERHUB_USERNAME"
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing repository secret DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Normalize image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=docker.io/${DOCKERHUB_USERNAME,,}/svnpanel" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ !github.event.release.prerelease }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            BUILD_TIME=${{ github.event.release.published_at }}
          cache-from: type=gha,scope=svnpanel-image
          cache-to: type=gha,mode=max,scope=svnpanel-image
          provenance: true
          sbom: true
