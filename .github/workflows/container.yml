name: Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: svnpanel:ci
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=svnpanel-image
          cache-to: type=gha,mode=max,scope=svnpanel-image

      - name: Start container
        run: |
          docker run --detach \
            --name svnpanel-ci \
            --publish 18080:8080 \
            --publish 13690:3690 \
            --env SVNPANEL_ADMIN_USERNAME=admin \
            --env SVNPANEL_ADMIN_PASSWORD=ci-admin-password \
            --env SVN_INIT_REPO=smoke \
            svnpanel:ci

      - name: Verify services
        run: |
          set -euo pipefail
          cleanup() {
            docker logs svnpanel-ci || true
            docker rm --force svnpanel-ci || true
          }
          trap cleanup EXIT

          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:18080/api/v1/healthz

          for attempt in $(seq 1 20); do
            set +e
            docker exec svnpanel-ci \
              svn info --non-interactive svn://127.0.0.1/smoke \
              > /tmp/svnserve-smoke.log 2>&1
            svn_status=$?
            set -e
            if [ "$svn_status" -eq 0 ]; then
              exit 0
            fi
            if grep -Eq \
              'E170001|authorization failed|Authorization failed' \
              /tmp/svnserve-smoke.log; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/svnserve-smoke.log
          exit 1

  publish:
    name: Publish to GHCR
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=svnpanel-image
          cache-to: type=gha,mode=max,scope=svnpanel-image
          provenance: true
          sbom: true
